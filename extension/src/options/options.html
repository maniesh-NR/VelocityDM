<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="options.css" />
  <title>VelocityDM Companion - Settings</title>
</head>
<body>
  <main>
    <h1>VelocityDM Companion</h1>

    <fieldset>
      <legend>Daemon connection</legend>
      <label>Host <input id="host" type="text" /></label>
      <label>Port <input id="port" type="number" min="1" max="65535" /></label>
      <button id="test-connection">Test connection</button>
      <span id="test-result" class="result"></span>
    </fieldset>

    <fieldset>
      <legend>Sniffing</legend>
      <label class="check"><input id="sniffEnabled" type="checkbox" /> Capture media from pages</label>
      <label>Minimum size (MB) <input id="minSizeMB" type="number" min="0" /></label>
      <fieldset class="inner">
        <legend>Categories</legend>
        <div id="categories"></div>
      </fieldset>
      <label>Blocked hosts (one per line)</label>
      <textarea id="blocklist" rows="4" spellcheck="false"></textarea>
    </fieldset>

    <fieldset>
      <legend>Behavior</legend>
      <label class="check"><input id="contextMenu" type="checkbox" /> Show "Download with VelocityDM" context menu</label>
      <label class="check"><input id="notify" type="checkbox" /> Show completion and failure notifications</label>
    </fieldset>

    <div class="actions">
      <button id="save" class="primary">Save</button>
      <span id="saved" class="result"></span>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
