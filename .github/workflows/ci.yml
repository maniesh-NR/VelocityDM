name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: cargo fmt (workspace)
        run: cargo fmt --all -- --check
      - name: cargo fmt (win7 payload)
        run: cargo fmt --manifest-path win7/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: sudo apt-get update -y && sudo apt-get install -y musl-tools libfontconfig1-dev
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-ubuntu:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: sudo apt-get update -y && sudo apt-get install -y musl-tools libfontconfig1-dev
      - run: cargo build --workspace --bins
      - run: cargo test --workspace

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo build --workspace --bins
      - run: cargo test --workspace

  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: newest stable (1.100+) breaks objc2 0.4.1 (eframe 0.27 macOS
      # stack, via icrate 0.0.4). 1.99.1 is the proven-green toolchain for
      # this dependency set; the Darwin release builds use their own pinned
      # rustc in the osxcross container for the same reason.
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: cargo build --workspace --bins
      - run: cargo test --workspace

  win7-payload:
    name: Windows 7 payload (Rust 1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.75.0 --profile minimal
      - run: rustup target add x86_64-pc-windows-gnu i686-pc-windows-gnu --toolchain 1.75.0
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: build headless payload (x86_64)
        run: cargo +1.75.0 zigbuild --manifest-path win7/Cargo.toml --locked --release -p velocitydm --no-default-features --features tls -p velocitydm-nmh --target x86_64-pc-windows-gnu
      - name: build headless payload (i686)
        run: cargo +1.75.0 zigbuild --manifest-path win7/Cargo.toml --locked --release -p velocitydm --no-default-features --features tls -p velocitydm-nmh --target i686-pc-windows-gnu

  ext-tests:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: shared-module suite
        run: node extensions/tests/run-tests.mjs

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      # libfontconfig: slint software-renderer font stack (Linux)
      - run: sudo apt-get update -y && sudo apt-get install -y libfontconfig1-dev
      - name: build release binaries
        run: cargo build --release
      - name: e2e smoke
        run: bash scripts/e2e.sh
      - name: e2e cross-feature
        run: bash scripts/e2e-cross.sh

  # Non-required preview frontends (S12): the native stacks build on
  # their real OSes; promotion to shipped assets is a later gated stage.

  win32-frontend:
    name: Windows frontend (Win32 + Direct2D)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - name: cargo fmt (frontend)
        run: cargo fmt --manifest-path frontend/win32/Cargo.toml --all -- --check
      - name: cargo clippy (frontend)
        run: cargo clippy --manifest-path frontend/win32/Cargo.toml --all-targets -- -D warnings
      - name: cargo build (frontend)
        run: cargo build --manifest-path frontend/win32/Cargo.toml --release

  swift-frontend:
    name: macOS frontend (Swift + AppKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: |
          cd macos-app
          swift build

  swiftui-frontend:
    name: macOS frontend (SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # S12-mac2: the ONLY witness for the SwiftUI tree — the dev sandbox
      # is Linux with no Swift toolchain, so local verification is source
      # review only (spec rule 11). swift build alone does NOT compile
      # test targets — swift test must ride the job or the golden tests
      # are dead code (spec rule 10).
      - name: swift build
        run: |
          cd macos-swiftui
          swift build
      - name: swift test
        run: |
          cd macos-swiftui
          swift test

  android-frontend:
    name: Android frontend (Views + KMP)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # S12-e: byte-identical mechanism to the frozen release.yml android
      # job (ubuntu-22.04 / temurin 17 / Gradle 8.9) — this is the only
      # automated compile witness for KMP-on-Gradle-8.9 and the R8 path.
      - name: shared unit tests (JVM)
        run: gradle -p android :shared:jvmTest --no-daemon
      - name: app builds (debug + minified release/R8)
        run: gradle -p android :app:assembleDebug :app:assembleRelease --no-daemon

  gtk3-frontend:
    name: Linux frontend (GTK3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      # S12-lin2: the ONLY compile/test witness for the gtk3 tree — the dev
      # sandbox has no libgtk-3-dev and no sudo (gate 0012). pkg-config is
      # listed explicitly: the gtk-sys build scripts hard-require it.
      - run: sudo apt-get update -y && sudo apt-get install -y libgtk-3-dev pkg-config
      - name: cargo fmt (frontend)
        run: cargo fmt --manifest-path gtk3/Cargo.toml --all -- --check
      - name: cargo clippy (frontend)
        run: cargo clippy --manifest-path gtk3/Cargo.toml --all-targets -- -D warnings
      - name: cargo build (frontend)
        run: cargo build --manifest-path gtk3/Cargo.toml --locked
      - name: cargo test (frontend, headless-safe)
        run: cargo test --manifest-path gtk3/Cargo.toml --locked

  qt-frontend:
    name: Linux frontend (Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      # S12-lin3: the ONLY compile/test witness for the qt/ tree — the dev
      # sandbox has no Qt and no sudo (gate 0017). ubuntu-24.04 is PINNED
      # (not ubuntu-latest) so the distro Qt (6.4.2 today) stays frozen
      # against the committed lock. The tools package is named explicitly
      # so a future Ubuntu package split cannot silently break moc/rcc
      # provisioning; qmake6 + /usr/lib/qt6/bin on PATH insure against
      # Ubuntu's qtchooser quirk (cxx-qt-build probes QMAKE/qmake).
      - run: sudo apt-get update -y && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-base-dev-tools qmake6 libgl1-mesa-dev
      - name: qmake6 on PATH (qtchooser insurance)
        run: echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: cargo fmt (frontend)
        run: cargo fmt --manifest-path qt/Cargo.toml --all -- --check
      - name: cargo clippy (frontend)
        run: cargo clippy --manifest-path qt/Cargo.toml --all-targets --locked -- -D warnings
      - name: cargo test (frontend, headless-safe)
        run: cargo test --manifest-path qt/Cargo.toml --locked
      - name: cargo build (frontend)
        run: cargo build --manifest-path qt/Cargo.toml --locked
      - name: QML rendering tripwire (PlainText discipline)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          qml_files = list(pathlib.Path('qt/qml').rglob('*.qml'))
          assert qml_files, "no QML sources found"
          for p in qml_files:
              text = p.read_text()
              # forbidden rich-text formats, anywhere
              for m in re.finditer(r'textFormat\s*:\s*Text\.(RichText|StyledText|MarkdownText)', text):
                  bad.append(f"{p}: forbidden textFormat {m.group(0)}")
              # every text-bearing element must carry PlainText near its
              # opening brace (first property lines)
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if re.match(r'\s*(Text|TextInput|TextEdit|TextField|TextArea|Label)\s*\{', line):
                      window = lines[i + 1 : i + 6]
                      if not any('textFormat: Text.PlainText' in w for w in window):
                          bad.append(f"{p}:{i + 1}: text-bearing element without textFormat: Text.PlainText")
              # dynamic QML is forbidden
              for m in re.finditer(r'createQmlObject|createComponent|Qt\.createComponent|\beval\s*\(', text):
                  bad.append(f"{p}: dynamic QML construct {m.group(0)}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"QML tripwire clean ({len(qml_files)} file(s))")
          PY
