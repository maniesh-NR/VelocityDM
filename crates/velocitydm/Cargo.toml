[package]
name = "velocitydm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VelocityDM daemon, CLI and GUI (Material Design 3 styled egui)"

[[bin]]
name = "velocitydm"
path = "src/main.rs"

[features]
default = ["gui", "tls"]
gui = ["dep:eframe"]
tls = ["vdm-core/tls"]

[dependencies]
vdm-core = { workspace = true }
vdm-rpc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
eframe = { workspace = true, optional = true }
