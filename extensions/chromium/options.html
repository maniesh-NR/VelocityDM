<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VelocityDM Options</title>
<style>
  :root {
    --primary: #6750a4; --on-primary: #fff; --surface: #1c1b1f;
    --container: #2b2930; --text: #e6e0e9; --dim: #cac4d0; --outline: #938f99;
  }
  body {
    margin: 0; padding: 24px; font: 14px/1.5 system-ui, sans-serif;
    background: var(--surface); color: var(--text);
  }
  h1 { color: #d0bcff; font-size: 20px; }
  fieldset {
    border: 1px solid var(--outline); border-radius: 12px; margin-bottom: 16px;
  }
  legend { color: var(--dim); padding: 0 8px; font-size: 12px; text-transform: uppercase; }
  label { display: block; margin: 8px 0; }
  .cats label { display: inline-block; margin-right: 14px; }
  textarea, input[type=text], input[type=number] {
    background: var(--container); border: 1px solid var(--outline); color: var(--text);
    border-radius: 8px; padding: 6px 10px; width: 100%; font: inherit;
  }
  textarea { min-height: 70px; }
  button {
    background: var(--primary); color: var(--on-primary); border: 0; border-radius: 18px;
    padding: 8px 22px; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--outline); }
  .status { margin-left: 12px; font-size: 13px; }
  .status.ok { color: #4ee9b0; }
  .status.err { color: #ffb4ab; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<h1>VelocityDM Options</h1>

<fieldset>
  <legend>Take over browser downloads</legend>
  <div class="cats" id="cats">
    <label><input type="checkbox" value="video"> Videos</label>
    <label><input type="checkbox" value="video-stream"> Streams (HLS/DASH)</label>
    <label><input type="checkbox" value="audio"> Audio</label>
    <label><input type="checkbox" value="archive"> Archives</label>
    <label><input type="checkbox" value="document"> Documents</label>
    <label><input type="checkbox" value="program"> Programs</label>
  </div>
  <label>Minimum size for generic files (MB)
    <input type="number" id="min-size" min="0" step="0.5" style="width:110px">
    <span class="hint">files smaller than this stay in the browser</span>
  </label>
  <label>Never intercept these hosts
    <textarea id="excluded" placeholder="example.com&#10;cdn.example.com"></textarea>
  </label>
</fieldset>

<fieldset>
  <legend>Native host</legend>
  <p class="hint">
    The extension talks to the VelocityDM engine through the native messaging host
    (velocitydm-nmh). Use the button to verify it is installed and the daemon is running.
  </p>
  <button id="test">Test connection</button><span class="status" id="test-status"></span>
</fieldset>

<fieldset>
  <legend>Advanced</legend>
  <label>Always-intercept extensions
    <input type="text" id="always-exts" placeholder="exe, msi, apk, zip, torrent">
  </label>
</fieldset>

<p>
  <button id="save">Save</button>
  <button id="reset" class="ghost">Reset to defaults</button>
  <span class="status" id="save-status"></span>
</p>

<script src="shared/filters.js"></script>
<script src="options.js"></script>
</body>
</html>
