[workspace]
resolver = "2"
members = [
    "crates/vdm-core",
    "crates/vdm-rpc",
    "crates/velocitydm",
    "crates/velocitydm-nmh",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["VelocityDM contributors"]
repository = "https://example.invalid/velocitydm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.27"
vdm-core = { path = "crates/vdm-core" }
vdm-rpc = { path = "crates/vdm-rpc" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "unwind"
